<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#182334">
  <title>Bello — Little AR Companion v0.6</title>
  <link rel="stylesheet" href="./style.css?v=0.6">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="overlay">
    <section class="panel">
      <div class="eyebrow">PROTOTYPE 0.6 · AR COMPANION</div>
      <h1>Meet Bello <span aria-hidden="true">👋</span></h1>
      <p id="instruction">Place Bello on your desk, then tap or talk to him. Try “Bello, dance!”</p>
      <button id="arButton" disabled>Checking AR support…</button>
      <button id="previewMicButton" class="preview-mic" type="button">🎙 Test voice in preview</button>
      <div id="status" role="status" aria-live="polite">Loading 3D preview…</div>
    </section>
    <div id="arControls" class="ar-controls" hidden>
      <div id="extras" class="activity-control" hidden>
        <div class="voice-commands" aria-label="Manual voice command alternatives">
          <button type="button" data-bello-command="dance">Dance</button>
          <button type="button" data-bello-command="jump">Jump</button>
          <button type="button" data-bello-command="wave">Wave</button>
          <button type="button" data-bello-command="read">Read</button>
          <button type="button" data-bello-command="wake">Wake</button>
        </div>
        <button id="playButton" class="play-button" type="button" title="Make Bello do something silly">Play ✨</button>
        <button id="breakButton" class="break-button" type="button" aria-label="Let Bello take a break">Try a break ☕</button>
        <button id="autoButton" class="auto-button" type="button" aria-pressed="true" title="Automatic activities after 30 seconds of inactivity">Auto: On</button>
        <button id="voiceRepliesButton" type="button" aria-pressed="true" title="Speak short replies using the phone voice">🗣 Replies: On</button>
        <button id="soundButton" class="sound-button" type="button" aria-pressed="true" title="Enable or mute Bello's playful sound effects">🔊 On</button>
      </div>
      <div class="placement-control">
        <button id="moveButton" class="move-button" type="button">Move Bello</button>
        <button id="micButton" class="mic-button" type="button" aria-pressed="false" title="Tap once, then say a voice command">🎙 Talk</button>
        <div class="size-control" aria-label="Bello size">
          <button id="smallerButton" type="button" aria-label="Make Bello smaller">−</button>
          <output id="sizeLabel">12 cm</output>
          <button id="largerButton" type="button" aria-label="Make Bello bigger">+</button>
        </div>
        <button id="moreButton" class="more-button" type="button" aria-controls="extras" aria-expanded="false" aria-label="Show extra Bello controls">⋯</button>
      </div>
    </div>
    <div id="tip" class="tip" hidden>Move your phone slowly over a well-lit flat surface.</div>
    <div id="voiceToast" class="voice-toast" role="status" aria-live="polite" hidden></div>
  </div>
  <script type="module" src="./app.js?v=0.6"></script>
</body>
</html>
